name: MSUpdate
run-name: Make MSUpdate ${{ inputs.makeversion }} by @${{ github.actor }} ${{ inputs.UpdateFromUUP == true && '- UUP' || '' }} ${{ inputs.MultiEdition == true && '- Multi' || ''}} ${{ inputs.SkipCheck == true && '- SkipCheck' || ''}}
on:
  workflow_dispatch:
    inputs:
      makeversion:
        description: "选择制作的系统版本"
        required: true
        type: choice
        options:
          - w1126h264
          - w1022h264
          - w11lt2464
          - w10lt2164
      UpdateFromUUP:
        description: "从UUPDUMP获取更新(1809+)"
        required: false
        default: true
        type: boolean
      MultiEdition:
        description: "转换多版本(LTSC勿选)"
        required: false
        default: true
        type: boolean
      SkipCheck:
        description: "跳过硬件检测(Win11)"
        required: false
        default: false
        type: boolean

jobs:
  msupdate:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Big Task
        shell: pwsh
        run: |
          $MakeVersion   = [string] "${{ inputs.makeversion }}"
          $UpdateFromUUP = [bool]   $${{ inputs.UpdateFromUUP }}
          $MultiEdition  = [bool]   $${{ inputs.MultiEdition }}
          $SkipCheck     = [bool]   $${{ inputs.SkipCheck }}
          .\msupdate.ps1

      - name: Upload ISO to OneDrive
        shell: pwsh
        env:
          ONEDRIVE_REFRESH_TOKEN: ${{ secrets.ONEDRIVE_REFRESH_TOKEN }}
          ONEDRIVE_SITE_ID: ${{ secrets.ONEDRIVE_SITE_ID }}
          ONEDRIVE_PATH: ${{ secrets.ONEDRIVE_PATH }}
        run: |
          .\.github\workflows\upload.ps1
